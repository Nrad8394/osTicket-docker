<VirtualHost *:80>
    ServerAdmin ${OST_SITE_EMAIL}
    ServerName localhost
    DocumentRoot /var/www/html

    # ── Main web root ─────────────────────────────────────────────
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Block direct access to sensitive backend directories ──────
    <DirectoryMatch "^/var/www/html/(include|bootstrap\.php)">
        Require all denied
    </DirectoryMatch>

    # Re-allow the client-facing includes
    <Directory /var/www/html/include/client>
        Require all granted
    </Directory>

    # ── Security headers ──────────────────────────────────────────
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ── Performance: cache static assets ─────────────────────────
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$">
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </FilesMatch>

    # ── Logs ──────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/osticket_error.log
    CustomLog ${APACHE_LOG_DIR}/osticket_access.log combined

    # ── Compression ───────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
    </IfModule>
</VirtualHost>
