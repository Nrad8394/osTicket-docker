site_name: OSTicket Support Docs
docs_dir: docs
site_description: KRA SmartSupport osTicket role and process documentation
# site_url: https://nrad8394.github.io/osTicket-docker/
# repo_url: https://github.com/Nrad8394/osTicket-docker
# repo_name: Nrad8394/osTicket-docker
# edit_uri: edit/main/OsTicket_Docs/docs/
copyright: Copyright © KRA Business Solutions Development

strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: relative_to_docs

theme:
  name: material
  language: en
  logo: assets/kra_logo_white_bg_white_txt_cropped.png
  favicon: assets/kra_logo_white_bg_white_txt_cropped.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red

plugins:
  - search:
      lang: en
      separator: '[\s\-]+'
  - print-site:
      add_to_navigation: true
      print_page_title: 'OSTicket Support Docs'
      add_print_site_banner: true
      add_table_of_contents: true
      toc_title: 'Table of Contents'
      toc_depth: 3
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      cover_page_template: ""
      include_css: true
      enabled: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

not_in_nav: |
  /Users/developer.md
  /Users/manager.md
  /Users/requester.md
  /Users/support_analyst.md

extra_css:
  - stylesheets/kra.css

extra_javascript:
  - javascripts/auto-print.js

nav:
  - Home: index.md
  - Role Guides:
      - Requester: Users/requester_guide.md
      - BAS Manager: Users/bas_manager_guide.md
      - Support Analyst: Users/support_analyst_guide.md
      - DEV Manager: Users/dev_manager_guide.md
      - Developer: Users/developer_guide.md
      - QA: Users/qa_guide.md
  - Process Documents:
      - Problem Statement: processes/problem_statement.md
      - Request for Change (RFC): processes/rfc.md
      - Release Package: processes/package.md
      - User Acceptance Testing (UAT): processes/uat.md
      - Resolution Report: processes/report.md
  - Troubleshooting: troubleshooting.md